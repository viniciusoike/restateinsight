# Renders the Quarto site and deploys _site/ to Netlify.
# - push to main  -> production deploy to https://restateinsight.com
# - pull requests -> deploy preview (comment + commit status "netlify")
# Posts rely on the committed _freeze/ cache, so only knitr is needed in CI.
name: Render site & deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write
  pull-requests: write
  statuses: write

concurrency:
  group: netlify-${{ github.event.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Needed by the knitr engine, which reads (_freeze/) cached chunk output
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr
        run: Rscript -e 'install.packages("knitr", repos = "https://cloud.r-project.org")'

      - name: Render site
        run: quarto render

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify-deploy@v3
        with:
          publish-dir: _site
          deploy-message: "${{ github.event_name == 'pull_request' && format('Deploy preview for PR #{0}', github.event.number) || format('Deploy from {0} ({1})', github.sha, github.event_name) }}"
          production-deploy: ${{ github.event_name != 'pull_request' }}
          alias: pr-${{ github.event.number }}
          enable-pull-request-comment: true
          enable-commit-status: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
