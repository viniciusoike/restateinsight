# Renders the Quarto site and deploys _site/ to Netlify.
# - push to main  -> production deploy to https://restateinsight.com
# - pull requests -> deploy preview (pr-<n> alias, PR comment + commit status)
# Posts rely on the committed _freeze/ cache, so only knitr is needed in CI.
name: Render site & deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: netlify-${{ github.event.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2

      # Needed by the knitr engine, which reads (_freeze/) cached chunk output
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr
        run: Rscript -e 'install.packages("knitr", repos = "https://cloud.r-project.org")'

      - name: Render site
        run: quarto render

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy preview (PR)
        if: github.event_name == 'pull_request'
        run: |
          netlify deploy --no-build --dir _site \
            --alias "pr-${{ github.event.number }}" \
            --message "Deploy preview for PR #${{ github.event.number }}" \
            --json > netlify.json
          cat netlify.json

      - name: Deploy production (main)
        if: github.event_name != 'pull_request'
        run: |
          netlify deploy --no-build --prod --dir _site \
            --message "Deploy from ${{ github.sha }} (${{ github.event_name }})" \
            --json > netlify.json
          cat netlify.json

      - name: Post deploy preview status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f netlify.json ]; then
            DEPLOY_URL=$(jq -r '.deploy_url // .ssl_url // .url' netlify.json)
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -f state=success \
              -f context="netlify" \
              -f target_url="$DEPLOY_URL" \
              -f description="Deploy preview ready"
          fi

      - name: Comment deploy preview on PR
        if: github.event_name == 'pull_request' && always() && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_URL=$(jq -r '.deploy_url // .ssl_url // .url' netlify.json)
          gh pr comment "${{ github.event.number }}" \
            --body "Deploy preview: $DEPLOY_URL"
